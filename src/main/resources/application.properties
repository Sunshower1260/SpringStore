spring.application.name=SpringStore

# =============================================
# MongoDB Configuration
# =============================================
spring.data.mongodb.uri=mongodb://root:secret@localhost:27017/mydatabase?authSource=admin
spring.data.mongodb.database=mydatabase

# =============================================
# Server
# =============================================
server.port=8080

# =============================================
# JWT Secret (override via env var APP_JWT_SECRET in production)
# =============================================
app.jwt.secret=${APP_JWT_SECRET:SpringStore-Dev-Secret-Key-Must-Be-At-Least-256-Bits-Long-For-HS256}

# =============================================
# CORS (override via env var APP_CORS_ORIGINS in production)
# =============================================
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000}

# =============================================
# Logging
# =============================================
logging.level.com.example.SpringStore=DEBUG
